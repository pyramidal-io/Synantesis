name: Synantesis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: forgejo-untrusted-pr-v1
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16@sha256:01e529f5119d4a943b55567d8aaa14a71a19c07054873617b406cd5f04b91380
        env:
          POSTGRES_PASSWORD: postgres
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MIX_ENV: test
      TEST_DB_POOL_SIZE: '10'
      TEST_DB_HOST: postgres
      SYNANTESIS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      HEX_CACERTS_PATH: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Checkout candidate without persisted credentials
        uses: https://code.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install operating system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential ca-certificates curl unzip xz-utils libssl3 libncurses6 libstdc++6 postgresql-client ffmpeg ripgrep
      - name: Install pinned toolchains
        run: bash scripts/ci/install-toolchains.sh
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            if pg_isready -h "$TEST_DB_HOST" -U postgres >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'PostgreSQL did not become ready' >&2
          exit 1
      - name: Run application gates
        run: bash scripts/ci/verify.sh

  policy:
    name: Policy
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: forgejo-untrusted-pr-v1
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout candidate without persisted credentials
        uses: https://code.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install policy dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl python3 python3-yaml shellcheck
      - name: Validate workflows, provenance and incoming secrets
        run: bash scripts/ci/policy.sh
